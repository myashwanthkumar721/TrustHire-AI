<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | TrustHire AI</title>

    <link rel="stylesheet" href="/frontend/css/auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                🤖 TrustHire AI
            </div>

            <h1 id="authTitle">Welcome Back</h1>

            <p id="authSubtitle">
                Login to continue to your AI hiring dashboard.
            </p>

            <!-- LOGIN -->

            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email address"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <!-- REGISTER -->

            <form id="registerForm" class="hidden">

                <input
                    type="text"
                    id="registerName"
                    placeholder="Full name"
                    required
                >

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Email address"
                    required
                >

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Password (minimum 8 characters)"
                    minlength="8"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>

            <p id="message"></p>

            <div class="switch">

                <span id="switchText">
                    Don't have an account?
                </span>

                <button type="button" id="switchBtn">
                    Register
                </button>

            </div>

            <a href="/" class="backHome">
                ← Back to Home
            </a>

        </div>

    </div>

    <script src="/frontend/js/auth.js"></script>

</body>

</html>
